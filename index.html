<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AquaControl</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #05070f; color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        /* Фон PS5 */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Карточка */
        .card { position: relative; z-index: 2; background: rgba(20, 26, 45, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 32px; padding: 30px 20px; width: 88%; max-width: 360px; text-align: center; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); }
        
        h1 { font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #8f9cae; margin-bottom: 20px; text-transform: uppercase; }
        
        .timer-display { margin: 10px 0 20px; }
        .days-left { font-size: 76px; font-weight: 800; color: #00f2fe; text-shadow: 0 0 30px rgba(0, 242, 254, 0.5); line-height: 1; }
        .days-label { font-size: 12px; color: #6e7d93; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Стильные кнопки-чипсы вместо белого списка */
        .setting-label { font-size: 12px; color: #8f9cae; text-align: left; margin-bottom: 10px; padding-left: 4px; }
        .period-selector { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 25px; }
        .chip { flex: 1; padding: 10px 0; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #8f9cae; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .chip.active { background: rgba(0, 242, 254, 0.15); border-color: #00f2fe; color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
        
        /* Главная кнопка */
        .btn { width: 100%; padding: 18px; border: none; border-radius: 18px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #0052d4, #4364f7, #6fb1fc); color: #fff; box-shadow: 0 8px 25px rgba(67, 100, 247, 0.4); }
        .btn-primary:active { transform: scale(0.96); }
        .btn-warning { background: rgba(255, 170, 0, 0.15); color: #ffaa00; border: 1px solid rgba(255, 170, 0, 0.3); margin-top: 8px; }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #a0aab8; margin-top: 8px; }
        
        /* Модальное окно */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 5, 12, 0.85); z-index: 10; justify-content: center; align-items: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .modal-content { background: #121724; padding: 25px; border-radius: 24px; width: 85%; max-width: 320px; border: 1px solid rgba(255, 255, 255, 0.12); text-align: center; }
        .modal h2 { font-size: 18px; color: #ff4757; margin-bottom: 8px; }
        .modal p { font-size: 13px; color: #8f9cae; margin-bottom: 18px; }

        /* Всплывающее неоновое уведомление (Вместо alert) */
        .toast { position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%); background: rgba(18, 23, 36, 0.95); border: 1px solid #00f2fe; color: #fff; padding: 12px 24px; border-radius: 50px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3); z-index: 20; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); opacity: 0; }
        .toast.show { bottom: 40px; opacity: 1; }
    </style>
</head>
<body>

    <canvas id="waveCanvas"></canvas>

    <div class="card">
        <h1>Фильтр воды</h1>
        
        <div class="timer-display">
            <div class="days-left" id="daysDisplay">--</div>
            <div class="days-label" id="statusLabel">дней осталось</div>
        </div>

        <div class="setting-label">Ресурс картриджа (дней):</div>
        <div class="period-selector">
            <button class="chip" onclick="selectInterval(30)">30</button>
            <button class="chip" onclick="selectInterval(60)">60</button>
            <button class="chip active" onclick="selectInterval(90)">90</button>
            <button class="chip" onclick="selectInterval(120)">120</button>
            <button class="chip" onclick="selectInterval(180)">180</button>
        </div>

        <button class="btn btn-primary" onclick="resetFilterQuick()">Заменил фильтр сегодня</button>
        <button class="btn btn-warning" style="margin-top:10px;" onclick="testExpireNow()">⚡ Протестировать сработку (Тест)</button>
    </div>

    <!-- Кастомный Toast -->
    <div class="toast" id="toast">Таймер обновлен!</div>

    <!-- Модальное окно -->
    <div class="modal" id="expiredModal">
        <div class="modal-content">
            <h2>Срок истек!</h2>
            <p>Фильтр отработал свой ресурс. Выберите действие:</p>
            <button class="btn btn-primary" onclick="confirmReset(90)">Заменил (сброс на 90 дн.)</button>
            <button class="btn btn-warning" onclick="postpone(15)">Отложить на 15 дней</button>
            <button class="btn btn-secondary" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        // Анимация волн
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, step = 0;

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const waves = [
            { length: 0.002, amplitude: 90, speed: 0.012, color: 'rgba(0, 162, 255, 0.12)', offset: 0 },
            { length: 0.001, amplitude: 120, speed: 0.008, color: 'rgba(0, 242, 254, 0.08)', offset: 2 },
            { length: 0.003, amplitude: 60, speed: 0.015, color: 'rgba(67, 100, 247, 0.15)', offset: 4 }
        ];

        function drawWaves() {
            ctx.clearRect(0, 0, width, height);
            waves.forEach(wave => {
                ctx.beginPath();
                ctx.fillStyle = wave.color;
                ctx.moveTo(0, height);
                for (let x = 0; x <= width; x += 10) {
                    let y = Math.sin((x * wave.length) + (step * wave.speed) + wave.offset) * wave.amplitude + (height / 2);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fill();
            });
            step++;
            requestAnimationFrame(drawWaves);
        }
        drawWaves();

        // Логика
        let filterData = JSON.parse(localStorage.getItem('waterFilterData')) || {
            startDate: new Date().getTime(),
            intervalDays: 90
        };

        function saveData() {
            localStorage.setItem('waterFilterData', JSON.stringify(filterData));
            updateUI();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerText = text;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateUI() {
            const now = new Date().getTime();
            const elapsedDays = Math.floor((now - filterData.startDate) / (1000 * 60 * 60 * 24));
            const daysLeft = filterData.intervalDays - elapsedDays;

            // Обновляем активную чипсу
            document.querySelectorAll('.chip').forEach(chip => {
                if (parseInt(chip.innerText) === filterData.intervalDays) chip.classList.add('active');
                else chip.classList.remove('active');
            });

            const daysDisplay = document.getElementById('daysDisplay');

            if (daysLeft <= 0) {
                daysDisplay.innerText = "0";
                daysDisplay.style.color = "#ff4757";
                document.getElementById('statusLabel').innerText = "Требуется замена!";
                document.getElementById('expiredModal').style.display = 'flex';
            } else {
                daysDisplay.innerText = daysLeft;
                daysDisplay.style.color = "#00f2fe";
                document.getElementById('statusLabel').innerText = "дней осталось";
            }
        }

        function selectInterval(days) {
            filterData.intervalDays = days;
            saveData();
            showToast(`Ресурс установлен: ${days} дней`);
        }

        function resetFilterQuick() {
            filterData.startDate = new Date().getTime();
            saveData();
            showToast("Таймер успешно обновлен!");
        }

        function confirmReset(days) {
            filterData.startDate = new Date().getTime();
            filterData.intervalDays = days;
            document.getElementById('expiredModal').style.display = 'none';
            saveData();
            showToast("Фильтр заменен! Отсчет сброшен.");
        }

        function postpone(days) {
            const now = new Date().getTime();
            const msPerDay = 1000 * 60 * 60 * 24;
            filterData.startDate = now - ((filterData.intervalDays - days) * msPerDay);
            document.getElementById('expiredModal').style.display = 'none';
            saveData();
            showToast(`Продлено на ${days} дней.`);
        }

        function closeModal() {
            document.getElementById('expiredModal').style.display = 'none';
        }

        updateUI();
    </script>
    function testExpireNow() {
    filterData.startDate = new Date().getTime() - (91 * 24 * 60 * 60 * 1000); // Относим дату на 91 день назад
    saveData();
}
</body>
</html>
