name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Prepare Web Dir and Build APK
      run: |
        # 1. Создаем отдельную чистую папку для сайта
        mkdir -p www
        cp index.html manifest.json icon.png www/ 2>/dev/null || :

        # 2. Устанавливаем инструменты сборки
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

        # 3. Инициализируем проект из папки www
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www

        # 4. Собираем нативный проект Android
        npx cap add android
        npx cap sync android

        # 5. Компилируем готовый .APK
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        CI: false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
