name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build Android App with Capacitor
      run: |
        # 1. Создаем чистый package.json
        npm init -y
        
        # 2. Устанавливаем Capacitor
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest
        
        # 3. Удаляем старые конфликтующие конфигурации (если есть)
        rm -f capacitor.config.json capacitor.config.ts
        rm -rf android
        
        # 4. Инициализируем проект с нуля
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir .
        
        # 5. Добавляем платформу Android
        npx cap add android
        
        # 6. Синхронизируем файлы
        npx cap copy android
        npx cap sync android
        
        # 7. Компилируем нативный APK файл
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      env:
        CI: false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
