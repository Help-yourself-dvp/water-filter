name: Build Native Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Capacitor & Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir .
        npx cap add android

    - name: Build Android APK
      run: |
        npx cap sync
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
