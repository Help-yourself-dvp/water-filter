name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода
      uses: actions/checkout@v4

    - name: 2. Настройка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 4. Подготовка веб-файлов
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 5. Установка Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7 @capacitor/browser@5.2.0

    - name: 6. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android

        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle

        sed -i 's/versionCode 1/versionCode 8/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.7"/g' android/app/build.gradle

        echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties

        sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' android/app/src/main/AndroidManifest.xml

        npx cap sync android

    - name: 7. Иконки: плотный фон #0284C7 + удаление webp (Fix MagicOS "О приложении")
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y imagemagick python3-pil

        # Удаляем ВСЕ дефолтные ic_launcher* (png/webp/xml), иначе MagicOS берёт webp с прозрачностью → чёрный фон
        find android/app/src/main/res -type f -name 'ic_launcher*' -delete
        rm -f android/app/src/main/res/values/ic_launcher_background.xml
        rm -rf android/app/src/main/res/drawable*/ic_launcher*

        if [ ! -f "icon.png" ]; then
          echo "icon.png not found, skip icon baking"
          exit 0
        fi

        # Надёжное запекание фона через Pillow
        python3 << 'PY'
from PIL import Image
import os

src = Image.open("icon.png").convert("RGBA")
bg_color = (2, 132, 199, 255)  # #0284C7

def bake(size, path):
    canvas = Image.new("RGBA", (size, size), bg_color)
    fg = src.copy()
    fg_size = int(size * 0.72)
    fg.thumbnail((fg_size, fg_size), Image.Resampling.LANCZOS)
    x = (size - fg.width) // 2
    y = (size - fg.height) // 2
    canvas.paste(fg, (x, y), fg)
    canvas.convert("RGB").save(path, format="PNG")

def bake_fg(size, path):
    canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
    fg = src.copy()
    fg_size = int(size * 0.72)
    fg.thumbnail((fg_size, fg_size), Image.Resampling.LANCZOS)
    x = (size - fg.width) // 2
    y = (size - fg.height) // 2
    canvas.paste(fg, (x, y), fg)
    canvas.save(path, format="PNG")

densities = {
    "mipmap-mdpi": 48,
    "mipmap-hdpi": 72,
    "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144,
    "mipmap-xxxhdpi": 192,
}
for folder, size in densities.items():
    d = f"android/app/src/main/res/{folder}"
    os.makedirs(d, exist_ok=True)
    bake(size, f"{d}/ic_launcher.png")
    bake(size, f"{d}/ic_launcher_round.png")
    bake_fg(size, f"{d}/ic_launcher_foreground.png")

os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
bake_fg(324, "android/app/src/main/res/drawable/ic_launcher_foreground.png")
src.resize((96, 96), Image.Resampling.LANCZOS).save(
    "android/app/src/main/res/drawable/ic_stat_icon.png", format="PNG"
)

bake(512, "icon_solid.png")
print("Icons baked OK")
PY

        mkdir -p android/app/src/main/res/values
        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<resources>' \
          '    <color name="colorPrimary">#0284C7</color>' \
          '    <color name="colorPrimaryDark">#0284C7</color>' \
          '    <color name="ic_launcher_background">#0284C7</color>' \
          '</resources>' \
          > android/app/src/main/res/values/colors.xml

        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
          '    android:width="108dp"' \
          '    android:height="108dp"' \
          '    android:viewportWidth="108"' \
          '    android:viewportHeight="108">' \
          '    <path' \
          '        android:fillColor="#0284C7"' \
          '        android:pathData="M0,0h108v108h-108z"/>' \
          '</vector>' \
          > android/app/src/main/res/drawable/ic_launcher_background.xml

        mkdir -p android/app/src/main/res/mipmap-anydpi-v26
        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <background android:drawable="@drawable/ic_launcher_background"/>' \
          '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
          '</adaptive-icon>' \
          > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

        printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
          '    <background android:drawable="@drawable/ic_launcher_background"/>' \
          '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
          '</adaptive-icon>' \
          > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        echo "=== launcher files ==="
        find android/app/src/main/res -name 'ic_launcher*' | sort

    - name: 8. Компиляция готового APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
