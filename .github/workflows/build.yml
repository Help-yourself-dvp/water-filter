name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода
      uses: actions/checkout@v4

    - name: 2. Настройка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 4. Подготовка веб-файлов
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 5. Установка Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7

    - name: 6. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android

        # Target SDK 34 (Android 14/15/16)
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle

        # Версия 1.0.6 (v7)
        sed -i 's/versionCode 1/versionCode 7/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.6"/g' android/app/build.gradle

        # Подавить warning AGP 8.0 + compileSdk 34
        echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties

        # Разрешения для фоновых будильников и уведомлений
        sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' android/app/src/main/AndroidManifest.xml

        npx cap sync android

    - name: 7. Запекание сине-голубого фона #0284C7 в растровые и векторные иконки (Fix MagicOS)
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y imagemagick

        # Убираем дефолтные заготовки Capacitor (drawable + values), чтобы не было Duplicate resources
        rm -rf android/app/src/main/res/drawable*/ic_launcher*
        rm -f android/app/src/main/res/values/ic_launcher_background.xml

        if [ -f "icon.png" ]; then
          # Растровая иконка с плотным сине-голубым фоном для меню "О приложении"
          convert icon.png -background "#0284C7" -flatten -alpha off icon_solid.png 2>/dev/null || cp icon.png icon_solid.png

          # 1. Растровые иконки во всех mipmap-* (кроме anydpi-v26)
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ "$dir" != "android/app/src/main/res/mipmap-anydpi-v26" ]; then
              cp icon_solid.png "$dir/ic_launcher.png"
              cp icon_solid.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

          # 2. Цвета приложения — ic_launcher_background ТОЛЬКО здесь (без дубля)
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="colorPrimary">#0284C7</color>\n    <color name="colorPrimaryDark">#0284C7</color>\n    <color name="ic_launcher_background">#0284C7</color>\n</resources>\n' > android/app/src/main/res/values/colors.xml

          # 3. Векторный фон в drawable
          mkdir -p android/app/src/main/res/drawable
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="108"\n    android:viewportHeight="108">\n    <path\n        android:fillColor="#0284C7"\n        android:pathData="M0,0h108v108h-108z"/>\n</vector>\n' > android/app/src/main/res/drawable/ic_launcher_background.xml

          cp icon.png android/app/src/main/res/drawable/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/drawable/ic_stat_icon.png

          # 4. Адаптивные иконки
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        fi

    - name: 8. Компиляция готового APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
