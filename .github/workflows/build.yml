name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание исходного кода
      uses: actions/checkout@v4

    - name: 2. Настройка Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Android SDK
      uses: android-actions/setup-android@v3

    - name: 4. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 5. Подготовка файлов проекта
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 6. Установка зависимостей Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

    - name: 7. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android
        npx cap sync android

    - name: 8. Компиляция нативного APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
