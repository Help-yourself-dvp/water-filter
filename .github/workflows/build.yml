name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода
      uses: actions/checkout@v4

    - name: 2. Настройка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 4. Подготовка файлов приложения
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 5. Установка Capacitor и плагина Уведомлений
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7

    - name: 6. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android
        npx cap sync android

    - name: 7. Замена Иконок и очистка XML дубликатов
      run: |
        # Удаляем конфликтную XML-папку, вызвавшую дублирование ресурсов
        rm -rf android/app/src/main/res/mipmap-anydpi-v26
        
        if [ -f "icon.png" ]; then
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done
        fi

    - name: 8. Компиляция готового APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
