name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода
      uses: actions/checkout@v4

    - name: 2. Настройка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 4. Подготовка веб-файлов
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 5. Установка Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7

    - name: 6. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android

        # Настройка Target SDK 34 (Android 14/15/16)
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle

        # Добавление системных разрешений
        sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>' android/app/src/main/AndroidManifest.xml

        npx cap sync android

    - name: 7. Безопасная подготовка адаптивных иконок и шторки
      run: |
        if [ -f "icon.png" ]; then
          # Замена классических растровых иконок
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ "$dir" != "android/app/src/main/res/mipmap-anydpi-v26" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

          # Иконка для шторки уведомлений (Status Bar Icon)
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/drawable/ic_stat_icon.png
        fi

    - name: 8. Компиляция готового APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
