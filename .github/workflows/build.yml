name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Скачивание кода
      uses: actions/checkout@v4

    - name: 2. Настройка JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Настройка Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 4. Подготовка веб-файлов
      run: |
        mkdir -p www
        cp index.html www/
        cp manifest.json www/ 2>/dev/null || true
        cp icon.png www/ 2>/dev/null || true

    - name: 5. Установка Capacitor
      run: |
        npm init -y
        npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/local-notifications@5.0.7

    - name: 6. Инициализация платформы Android
      run: |
        npx cap init "AquaControl Pro" "com.aquacontrol.pro" --web-dir www
        npx cap add android

        # Target SDK 34 (Android 14/15/16)
        sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle
        sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle

        # Повышаем версию приложения для обязательной очистки кэша значков MagicOS
        sed -i 's/versionCode 1/versionCode 3/g' android/app/build.gradle
        sed -i 's/versionName "1.0"/versionName "1.0.2"/g' android/app/build.gradle

        # Разрешения для работы фоновых будильников и уведомлений
        sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" \/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>' android/app/src/main/AndroidManifest.xml

        npx cap sync android

    - name: 7. Восстановление рабочего темного вектора (#04060E Fix "О приложении")
      run: |
        # Удаляем дефолтные растровые иконки Capacitor с буквой "T"
        rm -rf android/app/src/main/res/drawable*/ic_launcher*

        if [ -f "icon.png" ]; then
          # 1. Заменяем растровые иконки в mipmap
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ] && [ "$dir" != "android/app/src/main/res/mipmap-anydpi-v26" ]; then
              cp icon.png "$dir/ic_launcher.png"
              cp icon.png "$dir/ic_launcher_round.png"
              cp icon.png "$dir/ic_launcher_foreground.png"
            fi
          done

          # 2. Возвращаем оригинальный векторный темно-космический фон #04060E
          printf '<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="108"\n    android:viewportHeight="108">\n    <path\n        android:fillColor="#04060E"\n        android:pathData="M0,0h108v108h-108z"/>\n</vector>\n' > android/app/src/main/res/drawable/ic_launcher_background.xml

          cp icon.png android/app/src/main/res/drawable/ic_launcher_foreground.png
          cp icon.png android/app/src/main/res/drawable/ic_stat_icon.png

          # 3. Перезаписываем адаптивные иконки в mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@drawable/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@drawable/ic_launcher_background"/>\n    <foreground android:drawable="@drawable/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
        fi

    - name: 8. Компиляция готового APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: 9. Выгрузка готового APK файла
      uses: actions/upload-artifact@v4
      with:
        name: AquaControlPro-Native
        path: android/app/build/outputs/apk/debug/app-debug.apk
