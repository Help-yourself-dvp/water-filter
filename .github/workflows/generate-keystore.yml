name: Generate Stable Debug Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate stable debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=AquaControlPro, OU=Dev, O=AquaControlPro, L=Moscow, S=Moscow, C=RU"

      - name: Encode keystore to base64
        run: base64 -w0 debug.keystore > debug.keystore.base64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-debug-keystore
          path: |
            debug.keystore
            debug.keystore.base64.txt
